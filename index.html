<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Core Accounts</title>
    <style>
        :root { --bg: #0b1418; --primary: #e2231a; --text: #f1f1f2; --surface: #141f26; }
        body { margin: 0; padding: 20px; font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: var(--surface); padding: 20px; border-radius: 8px; }
        h1 { margin-top: 0; font-size: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
        textarea { width: 100%; height: 150px; background: #000; color: #fff; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .output { margin-top: 20px; white-space: pre-wrap; font-family: monospace; background: #000; padding: 10px; border: 1px solid #333; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>1. Configure Accounts</h1>
    <p>Simplement copier-coller .ROBLOSECURITY cookies ici ou charger un fichier.</p>
    <textarea id="cookieInput" placeholder=".ROBLOSECURITY=..."></textarea>
    <button onclick="analyzeCookies()">Analyze & Generate Config</button>
    <div id="output" class="output"></div>
</div>

<script>
    const input = document.getElementById('cookieInput');
    const output = document.getElementById('output');

    // Handle Drag/Drop
    const zone = document.createElement('div');
    zone.style.cssText = "position:absolute; top:0; left:0; width:100%; height:100%; background:#222; z-index:10; display:flex; align-items:center; justify-content:center;";
    zone.innerText = "DROP COOKIE FILE HERE";
    zone.style.border = "3px dashed var(--primary)";
    zone.style.opacity = "0";
    document.body.appendChild(zone);

    input.addEventListener('dragover', (e) => { e.preventDefault(); zone.style.opacity = "1"; });
    input.addEventListener('dragleave', () => zone.style.opacity = "0");
    input.addEventListener('drop', (e) => {
        e.preventDefault(); zone.style.opacity = "0";
        const fs = e.dataTransfer.files[0];
        if(fs) {
            const r = new FileReader(); r.onload = (ev) => { input.value += ev.target.result + "\n"; };
            r.readAsText(fs);
        }
    });

    window.analyzeCookies = function() {
        // Clean input
        const raw = input.value.replace(/\r/g, '').split('\n').filter(x => x.trim().includes('='));
        const valid = [];
        let total = 0;
        
        raw.forEach(line => {
            if (line.trim()) {
                total++;
                // Format simplifié pour stockage
                const parts = line.split('='); 
                valid.push(parts[1]);
            }
        });

        const result = {
            STATUS: "READY",
            CHECKED: total,
            VALID: valid.length,
            COOKIES: valid // .ROBLOSECURITY value
        };
        
        output.style.display = 'block';
        output.innerText = JSON.stringify(result, null, 2);
    };
</script>
</body>
</html>
