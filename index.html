<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Core Accounts</title>
    <style>
        :root {
            --bg: #0b1418;
            --primary: #e2231a;
            --text: #f1f1f2;
            --area: #141f26;
            --surface: #141f26; /* Fixed undefined variable */
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            padding: 20px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #000;
            color: #fff;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            border-radius: 4px;
        }

        button:hover {
            opacity: 0.9;
        }

        .output {
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace; /* Fixed invalid font 'minivan' */
            background: #000;
            padding: 10px;
            border: 1px solid #333;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>1. Configure Accounts</h1>
    <p>Simply copy and paste .ROBLOSECURITY cookies here or upload a file.</p>
    <textarea id="cookieInput" placeholder=".ROBLOSECURITY=..."></textarea>
    <button onclick="analyzeCookies()">Analyze & Generate Config</button>
    <div id="output" class="output"></div>
</div>

<script>
    const input = document.getElementById('cookieInput');
    const output = document.getElementById('output');

    // Handle Drag/Drop File Upload Overlay
    const zone = document.createElement('div');
    zone.style.cssText = "position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(34,34,34,0.9); z-index:10; display:flex; align-items:center; justify-content:center; border:3px dashed var(--primary); opacity:0; pointer-events:none; transition: opacity 0.2s ease;";
    zone.innerText = "DROP COOKIE FILE HERE";
    document.body.appendChild(zone);

    // Event listeners attached to window to catch global drag/drops cleanly
    window.addEventListener('dragover', (e) => { 
        e.preventDefault(); 
        zone.style.opacity = "1"; 
    });

    window.addEventListener('dragleave', (e) => { 
        if (e.relatedTarget === null) {
            zone.style.opacity = "0"; 
        }
    });

    window.addEventListener('drop', (e) => {
        e.preventDefault(); 
        zone.style.opacity = "0";
        const file = e.dataTransfer.files[0];
        if (file) {
            const reader = new FileReader(); 
            reader.onload = (event) => { 
                input.value += event.target.result + "\n"; 
            };
            reader.readAsText(file);
        }
    });

    window.analyzeCookies = function() {
        // Clean input lines containing equals signs
        const raw = input.value.replace(/\r/g, '').split('\n').filter(x => x.trim().includes('='));
        const valid = [];
        let total = 0;
        
        raw.forEach(line => {
            if (line.trim()) {
                total++;
                const parts = line.split('=');
                // Extract everything after the first '=' sign safely
                const value = parts.slice(1).join('=');
                valid.push(value.trim());
            }
        });

        const result = {
            STATUS: "READY",
            CHECKED: total,
            VALID: valid.length,
            COOKIES: valid
        };
        
        output.style.display = 'block';
        output.innerText = JSON.stringify(result, null, 2);
    };
</script>

</body>
</html>
